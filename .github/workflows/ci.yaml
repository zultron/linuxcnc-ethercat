---
name: cloudsmith.io packages
on:
  - push
  - pull_request

jobs:
  setup:
    name: Generate job matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read_vars.outputs['matrix'] }}
    steps:

      - name: Clone git repository
        uses: actions/checkout@v4

      - name: read-yaml-file
        uses: pietrobolcato/action-read-yaml@1.0.0
        id: read_vars
        with:
          config: .github/debian-distro-settings.yaml

  buildPackages:
    name: Build ${{ matrix.codename }} ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    needs:  setup
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    outputs:
      pkg_ver: ${{ steps.build_packages.outputs.pkg_ver }}
      matrix: ${{ needs.setup.outputs.matrix }}

    steps:

      - name: Clone git repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ghcr.io/${{ github.repository }}:${{ matrix.codename }}
          push: true
          build-args: |
            DEBIAN_DISTRO_BASE=${{ matrix.vendor }}:${{ matrix.codename }}
            ARCHITECTURE=${{ matrix.architecture }}
            ENTRYPOINT=/usr/bin/entrypoint
            DEBIAN_DIR=debian
          labels: |
            os_vendor=${{ matrix.vendor }}
            os_codename=${{ matrix.codename }}
            os_architecture=${{ matrix.architecture }}
          file: .github/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build packages
        id: build_packages
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DOCKER_TAG: ghcr.io/${{ github.repository }}:${{ matrix.codename }}
        run: |
          set -e

          PKG_VER="$(dpkg-parsechangelog -S version | sed 's/^[0-9]*://')"
          echo "pkg_ver=${PKG_VER}" >> $GITHUB_ENV
          echo "Package version:  $PKG_VER"

          echo ::group::Build debian packages

          docker run \
              -v ${HOME}:${HOME} \
              -e UID_OUT=$(id -u) -e GID_OUT=$(id -g) \
              -e HOME=${HOME} \
              -e PATH=/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              -e CCACHE_DIR=${PWD}/.ccache \
              -w ${PWD} \
              $DOCKER_TAG \
              dpkg-buildpackage -uc -us -a${ARCHITECTURE}

          mkdir -p pkgs
          ls -l ..
          mv ../linuxcnc-ethercat*${PKG_VER}* pkgs/

          echo "Final packages for upload:"
          ls -l pkgs/

          echo ::endgroup::

      - name: >
          Artifacts ${{ matrix.codename}} ${{ matrix.architecture }}
        uses: actions/upload-artifact@v4
        env:
          NAME_BASE: ${{ matrix.codename }}-${{ env.PKG_VER_ARCH }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        with:
          name: ${{ env.NAME_BASE }}-${{ env.GITHUB_SHA }}
          path: pkgs
          if-no-files-found: error

  pushPackages:
    needs: buildPackages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.buildPackages.outputs.matrix) }}
    name: Push pkgs ${{ matrix.codename }} ${{ matrix.architecture }}
    env:
      VERSION_ARCH: ${{ needs.buildPackages.outputs.pkg_ver }}_${{ matrix.architecture }}

    steps:
      - name: Download pkg build artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - uses: ./.github/actions/pushToCloudsmith
        with:
          vendor: ${{ matrix.vendor }}
          codename: ${{ matrix.codename }}
          fileName: linuxcnc-ethercat_${{ env.VERSION_ARCH }}.changes

      - uses: ./.github/actions/pushToCloudsmith
        with:
          vendor: ${{ matrix.vendor }}
          codename: ${{ matrix.codename }}
          fileName: linuxcnc-ethercat_${{ env.VERSION_ARCH }}.buildinfo

      - uses: ./.github/actions/pushToCloudsmith
        with:
          vendor: ${{ matrix.vendor }}
          codename: ${{ matrix.codename }}
          fileName: linuxcnc-ethercat_${{ env.VERSION_ARCH }}.deb

      - uses: ./.github/actions/pushToCloudsmith
        with:
          vendor: ${{ matrix.vendor }}
          codename: ${{ matrix.codename }}
          fileName: linuxcnc-ethercat-dbgsym_${{ env.VERSION_ARCH }}.ddeb
