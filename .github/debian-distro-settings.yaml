# Package name
package: linuxcnc-ethercat

# Project name for human-readable output
projectName: LinuxCNC Ethercat for Machinekit

# Package-specific command to run during image build before installing
#    build deps (default: none)
scriptPreCmd: .github/docker/linuxcnc-ethercat_script_pre.sh

# Cloudsmith repo namespace (org name); also may be set in $CLOUDSMITH_NAMESPACE
cloudsmith_repo_namespace: zultron
# Cloudsmith repo slug, if not the same as `package`
# cloudsmith_repo_slug: etherlabmaster
cloudsmith_repo_slug: etherlabmaster-test

matrix:
  # List of Debian and Ubuntu OS version configuration data
  - baseImage: debian:buster
    codename: Buster
    vendor: Debian
    release: 10
    architectures:
      - amd64
      # - arm64
      # - armhf
  # Machinekit not currently built for Debian Bullseye
  # - baseImage: debian:bullseye
  #   codename: Bullseye
  #   vendor: Debian
  #   release: 11
  #   architectures:
  #     - amd64
  #     # - arm64
  #     # - armhf
  - baseImage: ubuntu:focal
    codename: Focal
    vendor: Ubuntu
    release: 20.04
    architectures:
      - amd64
      # - arm64
      # - armhf
  # Trusty needs to build against LinuxCNC
  # - baseImage: ubuntu:trusty
  #   codename: Trusty
  #   vendor: Ubuntu
  #   release: 14.04
  #   architectures:
  #     - amd64
  - baseImage: ubuntu:jammy
    codename: Jammy
    vendor: Ubuntu
    release: 22.04
    architectures:
      - amd64
